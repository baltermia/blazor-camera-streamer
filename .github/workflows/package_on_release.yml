name: Create packages .NET Core

on:
  release:
    types: [published]

jobs:
  build:

    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write   # Trusted Publishing: request the OIDC token that is exchanged for a temporary NuGet API key
      packages: write   # Push to GitHub Packages with the GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Pack
        run: dotnet pack --no-build --configuration Release

      # Trusted Publishing: get a temporary API key (valid for 1 hour) instead of using a stored one
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org username (profile name), not the email address

      - name: Push NuGet
        run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Push GitHub
        run: nuget.exe push "**/*.nupkg" -SkipDuplicate
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
